<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Raghavendra Singh — GitHub profile preview</title>
  <style>
    :root { color-scheme: dark; background: #070b16; color: #f3f5fa; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px 56px; }
    main { width: min(100%, 1120px); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: clamp(1.3rem, 4vw, 2rem); }
    p { margin: 0 0 24px; color: #aab4c9; line-height: 1.55; }
    img { display: block; width: 100%; height: auto; margin: 0 0 18px; border-radius: 14px; }
    a { color: #66a4ff; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <h1>GitHub profile README preview</h1>
    <p>Local image-element preview of the five self-contained SVGs. Animations begin at 0 seconds; reduced-motion preferences are respected by each SVG.</p>
    <img src="./assets/hero.svg?v=1" alt="Animated profile hero">
    <img src="./assets/about-life.svg?v=1" alt="Capabilities and interests carousel">
    <img src="./assets/stack.svg?v=1" alt="Technology stack">
    <img src="./assets/id-dashboard.svg?v=1" alt="GitHub ID dashboard">
    <img src="./assets/connect.svg?v=1" alt="Social links illustration">
  </main>
</body>
</html>
